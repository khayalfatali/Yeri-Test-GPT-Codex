const NONCE='4ew73xiLvC71wx8n';
const STORAGE='yeri_v814_encrypted_settings_v1';
const $=id=>document.getElementById(id);
const from64=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-s.length%4)%4)),c=>c.charCodeAt(0));
const to64=bytes=>btoa(String.fromCharCode(...bytes));
let currentKey=null,appWin=null,queue=Promise.resolve();
async function decrypt(key,iv,payload,context){return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv,additionalData:new TextEncoder().encode(context)},key,payload));}
async function load(raw){
$('status').textContent='Şifrələnmiş kalkulyator açılır…';
const bytes=from64(raw);
if(bytes.length!==32)throw new Error('Giriş açarının uzunluğu düzgün deyil.');
const key=await crypto.subtle.importKey('raw',bytes,{name:'AES-GCM'},false,['encrypt','decrypt']);
const compressed=await decrypt(key,from64(NONCE),from64(PAYLOAD),'YeriClassicV814-v1');
if(!('DecompressionStream' in window))throw new Error('Bu brauzer yenilənməlidir: Safari 16.4+ tələb olunur.');
const html=await new Response(new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
if(!html.includes('Yeri') || !html.includes('window.__YeriSecureStorage'))throw new Error('Kalkulyator faylı düzgün deyil.');
let memory={};
try{const saved=localStorage.getItem(STORAGE);if(saved){const box=JSON.parse(saved);const rawSaved=await decrypt(key,from64(box.iv),from64(box.blob),'YeriSettingsV1');const val=JSON.parse(new TextDecoder().decode(rawSaved));if(val&&typeof val==='object'&&!Array.isArray(val))memory=val;}}catch(e){console.warn('Əvvəlki parametrləri açmaq alınmadı:',e.message);}
currentKey=key;
const serialized=JSON.stringify(memory).replace(/</g,'\\u003c');
const bootstrap='<script>window.__YeriSecureStorage=(function(){const cache='+serialized+';return {getItem(k){return Object.prototype.hasOwnProperty.call(cache,k)?cache[k]:null},setItem(k,v){cache[k]=String(v);parent.postMessage({kind:"yeri-store-v1",data:cache},"*")},removeItem(k){delete cache[k];parent.postMessage({kind:"yeri-store-v1",data:cache},"*")}}})();<\\/script>'.replace('<\\/script>','</scr'+'ipt>');
const page=html.replace('<script>',bootstrap+'<script>');
const iframe=$('appframe');
iframe.srcdoc=page;
appWin=iframe.contentWindow;
document.body.classList.add('ready');
}
window.addEventListener('message',event=>{if(!currentKey||event.source!==appWin||!event.data||event.data.kind!=='yeri-store-v1')return;const safe=event.data.data;if(!safe||typeof safe!=='object'||Array.isArray(safe))return;queue=queue.then(async()=>{const iv=crypto.getRandomValues(new Uint8Array(12));const plaintext=new TextEncoder().encode(JSON.stringify(safe));const output=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:new TextEncoder().encode('YeriSettingsV1')},currentKey,plaintext));try{localStorage.setItem(STORAGE,JSON.stringify({iv:to64(iv),blob:to64(output)}));}catch(e){console.warn('Brauzerdə yadda saxlamaq məhdudlaşdırılıb.');}}).catch(console.warn);});
$('form').addEventListener('submit',async ev=>{ev.preventDefault();$('open').disabled=true;try{await load($('pass').value.trim());}catch(e){$('status').textContent=e.message;$('open').disabled=false;}});
if(location.hash.startsWith('#key=')){const tok=location.hash.slice(5);$('pass').value=tok;load(tok).catch(e=>{$('status').textContent=e.message;});}
